<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoquiz - Interactive Geography Game</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/topojson.v3.min.js"></script>
    <!-- three.js (ESM) for the photographic orbital "Where Is My Spaceship?" view.
         Exposed as a global so the classic game.js can use it lazily on mode entry. -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        window.THREE = THREE;
        window.threeReady = true;
        window.dispatchEvent(new Event('three-ready'));
        // Fat-line addon for the spaceship country-outline hint. Loaded separately (dynamic
        // import + catch) so a CDN hiccup here can never block window.THREE / three-ready —
        // the hint just falls back to 1px lines if it's unavailable.
        Promise.all([
            import('three/addons/lines/LineSegments2.js'),
            import('three/addons/lines/LineSegmentsGeometry.js'),
            import('three/addons/lines/LineMaterial.js')
        ]).then(([seg2, geom, mat]) => {
            window.THREE_Lines = { LineSegments2: seg2.LineSegments2, LineSegmentsGeometry: geom.LineSegmentsGeometry, LineMaterial: mat.LineMaterial };
            window.dispatchEvent(new Event('three-lines-ready'));
        }).catch(e => console.warn('Fat-line addon failed to load; country-outline hint will use thin lines', e));
    </script>
    <script>
        // Apply saved color theme before first paint to avoid a flash
        (function () {
            var t = localStorage.getItem('geoquiz-theme');
            if (t === 'emerald') document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <button id="theme-toggle" type="button" title="Switch color theme" aria-label="Switch color theme">
        <span class="material-symbols-outlined">palette</span>
    </button>
    <div class="container">
        <header id="landing-header">
            <h1><span class="material-symbols-outlined">public</span> Geoquiz</h1>
            <p class="subtitle">Test your geography knowledge!</p>
        </header>

        <!-- Top Bar (shown during game) -->
        <div class="top-bar" id="top-bar" style="display: none;">
            <span class="top-bar-title" id="home-link">Geoquiz</span>
            <div class="top-bar-modes">
                <div class="icon-dropdown" id="find-dropdown">
                    <button class="mode-icon-btn" id="find-mode-btn" title="Find on Map"><span class="material-symbols-outlined">search</span></button>
                    <div class="dropdown-menu">
                        <button class="dropdown-item" data-mode="countries">World</button>
                        <button class="dropdown-item" data-mode="us-states">USA</button>
                        <button class="dropdown-item" data-mode="indian-states">India</button>
                        <button class="dropdown-item" data-mode="german-states">Germany</button>
                        <button class="dropdown-item" data-mode="uk-states">England</button>
                        <button class="dropdown-item" data-mode="mexican-states">Mexico</button>
                    </div>
                </div>
                <div class="icon-dropdown" id="identify-dropdown">
                    <button class="mode-icon-btn" id="identify-mode-btn" title="Identify"><span class="material-symbols-outlined">help</span></button>
                    <div class="dropdown-menu">
                        <button class="dropdown-item" data-identify-region="countries">World</button>
                        <button class="dropdown-item" data-identify-region="us-states">USA</button>
                        <button class="dropdown-item" data-identify-region="indian-states">India</button>
                        <button class="dropdown-item" data-identify-region="german-states">Germany</button>
                        <button class="dropdown-item" data-identify-region="uk-states">England</button>
                        <button class="dropdown-item" data-identify-region="mexican-states">Mexico</button>
                    </div>
                </div>
                <button class="mode-icon-btn" data-mode="name-all" title="Name All Countries"><span class="material-symbols-outlined">keyboard</span></button>
                <button class="mode-icon-btn" data-mode="population-order" title="Order by Population"><span class="material-symbols-outlined">bar_chart</span></button>
                <button class="mode-icon-btn" data-mode="flags" title="Flags"><span class="material-symbols-outlined">flag</span></button>
                <button class="mode-icon-btn" data-mode="capitals" title="Capitals"><span class="material-symbols-outlined">star</span></button>
                <button class="mode-icon-btn" data-mode="free-explore" title="Free Explore"><span class="material-symbols-outlined">explore</span></button>
                <button class="mode-icon-btn" data-mode="places" title="Places I've Been"><span class="material-symbols-outlined">push_pin</span></button>
                <button class="mode-icon-btn" data-mode="state-puzzle" title="Puzzle"><span class="material-symbols-outlined">extension</span></button>
                <button class="mode-icon-btn" data-mode="country-shape-id" title="Country Shape ID"><span class="material-symbols-outlined">pentagon</span></button>
                <button class="mode-icon-btn" data-mode="spaceship" title="Where Is My Spaceship?"><span class="material-symbols-outlined">rocket_launch</span></button>
                <button class="mode-icon-btn" data-mode="sb-missing" title="Who's Missing?"><span class="material-symbols-outlined">search_off</span></button>
                <button class="mode-icon-btn" data-mode="sun-moon" title="Sun &amp; Moon"><span class="material-symbols-outlined">wb_twilight</span></button>
                <button class="mode-icon-btn" data-mode="sandbox" title="Sandbox"><span class="material-symbols-outlined">science</span></button>
                <!-- Skyline ID: hidden until the photo pool is vetted (mode still fully works —
                     see skylineIdMode in game.js). Uncomment to bring it back to the menu. -->
                <!-- <button class="mode-icon-btn" data-mode="skyline-id" title="Skyline ID"><span class="material-symbols-outlined">apartment</span></button> -->
            </div>
            <div class="top-bar-score">
                <span><span id="question-inline">1</span>/<span id="total-inline">10</span></span>
                <span class="score-label">Score: <span id="score-inline">0</span></span>
            </div>
        </div>

        <!-- Mode Selector -->
        <div class="mode-selector" id="mode-selector">
            <h2>Select Quiz Mode</h2>
            <div class="mode-buttons" id="mode-buttons">
                <button class="mode-btn" data-mode="find">
                    <span class="mode-icon material-symbols-outlined">search</span>
                    <span class="mode-name">Find on the Map</span>
                    <span class="mode-desc">Find countries or states on the globe/map</span>
                </button>
                <button class="mode-btn" data-mode="identify">
                    <span class="mode-icon material-symbols-outlined">help</span>
                    <span class="mode-name">Identify Mode</span>
                    <span class="mode-desc">Identify highlighted locations on the map</span>
                </button>
                <button class="mode-btn" data-mode="name-all">
                    <span class="mode-icon material-symbols-outlined">keyboard</span>
                    <span class="mode-name">Name All Countries</span>
                    <span class="mode-desc">Type as many countries as you can!</span>
                </button>
                <button class="mode-btn" data-mode="population-order">
                    <span class="mode-icon material-symbols-outlined">bar_chart</span>
                    <span class="mode-name">Order by Population</span>
                    <span class="mode-desc">Drag countries to order them by population</span>
                </button>
                <button class="mode-btn" data-mode="flags">
                    <span class="mode-icon material-symbols-outlined">flag</span>
                    <span class="mode-name">Flags</span>
                    <span class="mode-desc">Find the country from its flag, or match every flag at once</span>
                </button>
                <button class="mode-btn" data-mode="capitals">
                    <span class="mode-icon material-symbols-outlined">star</span>
                    <span class="mode-name">Capitals</span>
                    <span class="mode-desc">Multiple choice, typing race, or pin it on the map</span>
                </button>
                <button class="mode-btn" data-mode="free-explore">
                    <span class="mode-icon material-symbols-outlined">explore</span>
                    <span class="mode-name">Free Explore</span>
                    <span class="mode-desc">Explore the globe and click to learn about countries</span>
                </button>
                <button class="mode-btn" data-mode="places">
                    <span class="mode-icon material-symbols-outlined">push_pin</span>
                    <span class="mode-name">Places I've Been</span>
                    <span class="mode-desc">Fill in the map with your travels and share it</span>
                </button>
                <button class="mode-btn" data-mode="state-puzzle">
                    <span class="mode-icon material-symbols-outlined">extension</span>
                    <span class="mode-name">US States Puzzle</span>
                    <span class="mode-desc">Drag every state into place — pieces snap when close</span>
                </button>
                <button class="mode-btn" data-mode="country-shape-id">
                    <span class="mode-icon material-symbols-outlined">pentagon</span>
                    <span class="mode-name">Country Shape ID</span>
                    <span class="mode-desc">Identify countries by their shape</span>
                </button>
                <button class="mode-btn" data-mode="sb-missing">
                    <span class="mode-icon material-symbols-outlined">search_off</span>
                    <span class="mode-name">Who's Missing?</span>
                    <span class="mode-desc">A country has been absorbed by its neighbours — which one?</span>
                </button>
                <button class="mode-btn" data-mode="sun-moon">
                    <span class="mode-icon material-symbols-outlined">wb_twilight</span>
                    <span class="mode-name">Sun &amp; Moon</span>
                    <span class="mode-desc">Day, night and the sunrise line at any date and time</span>
                </button>
                <button class="mode-btn" data-mode="spaceship">
                    <span class="mode-icon material-symbols-outlined">rocket_launch</span>
                    <span class="mode-name">Where Is My Spaceship?</span>
                    <span class="mode-desc">Guess your orbital location from the view below</span>
                </button>
                <button class="mode-btn" data-mode="sandbox">
                    <span class="mode-icon material-symbols-outlined">science</span>
                    <span class="mode-name">Sandbox</span>
                    <span class="mode-desc">Sun &amp; moon, sun path, odd one out, draw the border</span>
                </button>
                <!-- Skyline ID: hidden until the photo pool is vetted (mode still fully works —
                     see skylineIdMode in game.js). Uncomment to bring it back to the menu. -->
                <!-- <button class="mode-btn" data-mode="skyline-id">
                    <span class="mode-icon material-symbols-outlined">apartment</span>
                    <span class="mode-name">Skyline ID</span>
                    <span class="mode-desc">Name the city from a photo of its skyline</span>
                </button> -->
            </div>
        </div>

        <!-- States Sub-Mode Selector (no longer used but kept for back-compat) -->
        <div class="mode-selector hidden" id="states-selector">
            <h2>Select Region</h2>
            <div class="mode-buttons">
                <button class="mode-btn" data-mode="us-states">
                    <span class="mode-icon material-symbols-outlined">location_city</span>
                    <span class="mode-name">US States</span>
                    <span class="mode-desc">Quiz on the 50 United States</span>
                </button>
                <button class="mode-btn" data-mode="indian-states">
                    <img src="https://flagpedia.net/data/flags/w160/in.png" alt="India" class="mode-flag-icon-lg">
                    <span class="mode-name">Indian States</span>
                    <span class="mode-desc">Quiz on states and union territories of India</span>
                </button>
                <button class="mode-btn" data-mode="german-states">
                    <img src="https://flagpedia.net/data/flags/w160/de.png" alt="Germany" class="mode-flag-icon-lg">
                    <span class="mode-name">German States</span>
                    <span class="mode-desc">Quiz on the 16 Bundesländer of Germany</span>
                </button>
                <button class="mode-btn" data-mode="uk-states">
                    <img class="mode-icon" src="https://flagcdn.com/gb-eng.svg" alt="England" />
                    <span class="mode-name">England Counties</span>
                    <span class="mode-desc">Quiz on the 47 ceremonial counties of England</span>
                </button>
                <button class="mode-btn" data-mode="mexican-states">
                    <img class="mode-icon" src="https://flagcdn.com/mx.svg" alt="Mexico" />
                    <span class="mode-name">Mexican States</span>
                    <span class="mode-desc">Quiz on the 32 states of Mexico</span>
                </button>
            </div>
            <button id="back-to-modes-btn" class="btn secondary" style="margin-top: 20px;">Back</button>
        </div>

        <div class="game-info hidden" id="game-info">
            <div class="score-board">
                <div class="score-item">
                    <span class="label">Score:</span>
                    <span class="value" id="score">0</span>
                </div>
                <div class="score-item">
                    <span class="label">Question:</span>
                    <span class="value"><span id="current-question">1</span>/<span id="total-questions">10</span></span>
                </div>
            </div>
        </div>

        <!-- Globe-mode layout: the map/globe gets the lion's share of the space; question
             text, flag and multiple-choice all live in a narrow side panel beside it. For
             modes that don't use the globe, .globe-layout/.globe-side-panel fall back to
             `display: contents` (see style.css) so #map-container/#question-container/
             #multiple-choice-container behave exactly as if they were direct children of
             .container, same as before this wrapper existed. -->
        <div class="globe-layout" id="globe-layout">
            <!-- Standard Map/Globe Container (for non-world-quiz modes) -->
            <div class="map-container hidden" id="map-container">
                <svg id="globe"></svg>
            </div>

            <div class="globe-side-panel" id="globe-side-panel">
                <div class="question-container hidden" id="question-container">
                    <div class="question">
                        <h2 id="question-text">Find: <span id="country-name">Loading...</span></h2>
                    </div>
                    <div class="flag-display" id="flag-display" style="display: none;">
                        <img id="flag-image" src="" alt="Country Flag" />
                    </div>
                    <!-- Skyline ID photo panel. The credit line is populated up front but stays
                         hidden until the round is decided — the Commons title names the city. -->
                    <div class="skyline-display" id="skyline-display" style="display: none;">
                        <div class="skyline-frame">
                            <img id="skyline-image" alt="Photograph of a city skyline" />
                            <div class="skyline-status" id="skyline-status"></div>
                        </div>
                        <div class="skyline-credit" id="skyline-credit" style="display: none;"></div>
                    </div>
                    <div class="feedback" id="feedback"></div>
                </div>

                <div class="multiple-choice-container hidden" id="multiple-choice-container">
                    <div class="options-grid" id="options-grid"></div>
                </div>
            </div>
        </div>

        <!-- World Quiz Question Bar (placed below game-info for compact layout) -->
        <div class="world-quiz-question-bar hidden" id="world-quiz-question-bar">
            <h2 id="world-quiz-current-question"></h2>
        </div>

        <!-- World Quiz Mode Layout: Globe + Side Panels -->
        <div class="world-quiz-layout hidden" id="world-quiz-layout">
            <div class="world-quiz-globe">
                <svg id="globe-world"></svg>
            </div>
            <div class="world-quiz-panels">
                <div class="world-quiz-panel-top" id="world-quiz-panel-top">
                    <div class="question">
                        <h2 id="flag-question-text"></h2>
                    </div>
                    <div class="flag-display" id="flag-display-side" style="display: none;">
                        <img id="flag-image-side" src="" alt="Country Flag" />
                    </div>
                    <div class="multiple-choice-container" id="flag-choice-container" style="display: none;">
                        <div class="options-grid" id="flag-options-grid"></div>
                    </div>
                    <div class="feedback" id="flag-feedback"></div>
                </div>
                <div class="world-quiz-panel-bottom" id="world-quiz-panel-bottom">
                    <div class="question">
                        <h2 id="capital-question-text"></h2>
                    </div>
                    <div class="multiple-choice-container" id="capital-choice-container" style="display: none;">
                        <div class="options-grid" id="capital-options-grid"></div>
                    </div>
                    <div class="feedback" id="capital-feedback"></div>
                </div>
            </div>
        </div>

        <div class="controls hidden" id="controls">
            <button id="next-btn" class="btn" disabled>Next Question</button>
            <button id="give-up-btn" class="btn secondary">Give Up</button>
            <button id="restart-btn" class="btn secondary">Restart Game</button>
            <button id="projection-toggle" class="btn secondary globe-only" title="Switch between globe and flat map">View: Globe</button>
            <button id="gamma-lock-toggle" class="btn secondary globe-only" title="Toggle globe tilt lock">Tilt: Locked</button>
            <button id="detail-toggle" class="btn secondary" title="Map detail level">Detail: Medium</button>
            <button id="hint-outlines-toggle" class="btn secondary" title="Overlay country outlines on the globe (hint)" style="display:none">Outlines: Off</button>
            <button id="map-colour-toggle" class="btn secondary" title="Colour the map so no two neighbours share a colour" style="display:none">Colours: Off</button>
            <button id="debug-validity-toggle" class="btn secondary" title="Color-code map by which countries have quiz data">Debug: Off</button>
            <button id="share-btn" class="btn secondary" title="Copy a link to this mode / challenge a friend"><span class="material-symbols-outlined">share</span> Share</button>
            <button id="settings-btn" class="btn secondary" title="Tuning &amp; settings"><span class="material-symbols-outlined">tune</span> Settings</button>
        </div>

        <!-- Settings pop-up: all tuning sliders live here (opened from the Settings button). -->
        <div class="settings-overlay hidden" id="settings-overlay">
            <div class="settings-panel" role="dialog" aria-modal="true" aria-label="Settings">
                <div class="settings-header">
                    <h3>Settings</h3>
                    <button class="settings-close" id="settings-close" type="button" aria-label="Close settings">&times;</button>
                </div>
                <div class="settings-body">
                    <div class="tuning-group" id="spaceship-tuning" style="display:none">
                        <div class="tuning-group-title">Spaceship</div>
                        <label class="tuning-item" title="Camera altitude (lower = more grazing horizon). Capped at 500 km.">
                            <span class="tuning-label">Orbit height</span> <input type="range" id="tune-orbit-height" min="150" max="500" step="10" value="250"><span id="tune-orbit-height-val">250 km</span>
                        </label>
                        <label class="tuning-item" title="Fetch NASA's full 500 m Blue Marble tiles live and stitch the visible cap (sharpest, but each round pulls tens of MB — not bundled with the app). Off = a lighter single-globe crop.">
                            <span class="tuning-label">500 m tiles</span> <input type="checkbox" id="tune-hires-500m">
                        </label>
                        <label class="tuning-item" title="How far the atmosphere gradient reaches ABOVE the horizon (space side), measured as a view ray's tangent altitude above the surface. Capped at 600 km.">
                            <span class="tuning-label">Atmo spread (space)</span> <input type="range" id="tune-atmo-spread-space" min="20" max="600" step="10" value="120"><span id="tune-atmo-spread-space-val">120 km</span>
                        </label>
                        <label class="tuning-item" title="How far the atmosphere gradient reaches BELOW the horizon (earth side). Capped at 1500 km — ground haze reads much further than the space-side glow.">
                            <span class="tuning-label">Atmo spread (earth)</span> <input type="range" id="tune-atmo-spread-earth" min="50" max="1500" step="50" value="200"><span id="tune-atmo-spread-earth-val">200 km</span>
                        </label>
                        <label class="tuning-item" title="The space side always fades linearly with distance from the horizon. Check this to warp the earth side through a curve that simulates looking through progressively more atmosphere as you look closer to the ground.">
                            <span class="tuning-label">Atmospheric depth</span> <input type="checkbox" id="tune-atmo-tan-earth">
                        </label>
                        <!-- 5-stop atmosphere gradient. Left = space, the tick = the horizon, right = down
                             into the earth's disc. The centre "Horizon" stop is pinned at the limb and
                             can't be dragged — only its colour/opacity are editable. Handles and stop
                             rows are built by buildAtmoEditor(). -->
                        <div class="tuning-item atmo-item" title="Atmosphere gradient across the horizon. Drag the handles to move each stop (the centre one is fixed); set its colour and opacity below.">
                            <span class="tuning-label">Atmosphere</span>
                            <div class="atmo-editor">
                                <div class="atmo-track" id="atmo-track">
                                    <div class="atmo-preview" id="atmo-preview"></div>
                                    <div class="atmo-limb" title="The horizon"></div>
                                </div>
                                <div class="atmo-axis"><span>space</span><span>horizon</span><span>earth</span></div>
                                <div class="atmo-stops" id="atmo-stops"></div>
                            </div>
                        </div>
                        <label class="tuning-item" title="Max points for a perfect-distance guess">
                            <span class="tuning-label">Accuracy</span> <input type="range" id="tune-score-acc" min="0" max="100" step="5" value="60"><span id="tune-score-acc-val">60</span>
                        </label>
                        <label class="tuning-item" title="Max points for an instant guess">
                            <span class="tuning-label">Speed</span> <input type="range" id="tune-score-speed" min="0" max="100" step="5" value="40"><span id="tune-score-speed-val">40</span>
                        </label>
                        <label class="tuning-item" title="Points deducted per degree of look-around panning">
                            <span class="tuning-label">Pan penalty</span> <input type="range" id="tune-score-pan" min="0" max="2" step="0.05" value="0.15"><span id="tune-score-pan-val">0.15</span>
                        </label>
                        <label class="tuning-item" title="Distance (km) at which accuracy points fall to ~37%">
                            <span class="tuning-label">Dist scale</span> <input type="range" id="tune-score-dist" min="100" max="3000" step="100" value="500"><span id="tune-score-dist-val">500 km</span>
                        </label>
                        <label class="tuning-item" title="Seconds at which speed points fall to ~37%">
                            <span class="tuning-label">Time scale</span> <input type="range" id="tune-score-time" min="5" max="120" step="5" value="20"><span id="tune-score-time-val">20 s</span>
                        </label>
                    </div>
                    <div class="tuning-group" id="gameplay-tuning-row">
                        <div class="tuning-group-title">Gameplay</div>
                        <label class="tuning-item" title="Pause used everywhere a question is answered: how long a correct answer holds before advancing, and how long a wrong answer holds (both before AND after the correct answer is revealed alongside it).">
                            <span class="tuning-label">Answer pause</span> <input type="range" id="tune-answer-pause" min="300" max="3000" step="100" value="1200"><span id="tune-answer-pause-val">1200 ms</span>
                        </label>
                    </div>
                    <div class="tuning-group" id="tuning-row">
                        <div class="tuning-group-title">Map</div>
                        <label class="tuning-item" title="Largest on-screen size (px) below which a feature shows as a dot">
                            <span class="tuning-label">Min dot px</span> <input type="range" id="tune-dotsize" min="0" max="20" step="0.1" value="5"><span id="tune-dotsize-val">5</span>
                        </label>
                        <label class="tuning-item" title="Minimum spacing (px) enforced between dots">
                            <span class="tuning-label">Dot spacing</span> <input type="range" id="tune-dotspace" min="0" max="5" step="0.1" value="5"><span id="tune-dotspace-val">5</span>
                        </label>
                        <label class="tuning-item" title="US States Puzzle: base distance a dropped piece may miss its true position by and still snap home. Difficulty scales this — Easy uses it as-is, Medium halves it, Hard uses a fifth. Measured on the map's fixed 800x600 coordinate grid, so it doesn't drift with the window size.">
                            <span class="tuning-label">Puzzle snap</span> <input type="range" id="tune-puzzle-snap" min="8" max="60" step="1" value="24"><span id="tune-puzzle-snap-val">24</span>
                        </label>
                        <label class="tuning-item" title="Play a soft click each time a puzzle piece snaps into place.">
                            <span class="tuning-label">Puzzle click</span> <input type="checkbox" id="tune-puzzle-sound" checked>
                        </label>
                        <!-- Hard (blind) puzzle scoring: each state is worth 10 points, split
                             between how close the drop was and how quickly it was made. -->
                        <label class="tuning-item" title="US States Puzzle (Hard): how each state's 10 points are split between accuracy and speed. 100% is pure accuracy, 0% is pure speed.">
                            <span class="tuning-label">Blind accuracy/speed</span> <input type="range" id="tune-puzzle-balance" min="0" max="100" step="5" value="70"><span id="tune-puzzle-balance-val">70% / 30%</span>
                        </label>
                        <label class="tuning-item" title="US States Puzzle (Hard): the placement error at which the accuracy half of the score falls to about 37%.">
                            <span class="tuning-label">Blind dist scale</span> <input type="range" id="tune-puzzle-dist" min="50" max="1500" step="50" value="300"><span id="tune-puzzle-dist-val">300 km</span>
                        </label>
                        <label class="tuning-item" title="US States Puzzle (Hard): the time per state at which the speed half of the score falls to about 37%.">
                            <span class="tuning-label">Blind time scale</span> <input type="range" id="tune-puzzle-time" min="2" max="60" step="1" value="10"><span id="tune-puzzle-time-val">10 s</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme toggle: cycle between the two palettes and persist the choice
        (function () {
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            btn.addEventListener('click', function () {
                var emerald = document.documentElement.getAttribute('data-theme') === 'emerald';
                if (emerald) {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('geoquiz-theme', 'ocean');
                } else {
                    document.documentElement.setAttribute('data-theme', 'emerald');
                    localStorage.setItem('geoquiz-theme', 'emerald');
                }
            });
        })();
    </script>
    <script src="game.js"></script>
</body>
</html>
